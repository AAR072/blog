baseURL: "https://research.aliakber.ca/"
title: "Ali Raza / Research"
locale: "en-CA"
timeZone: "America/Toronto"
pagination.pagerSize: 10
theme: PaperModX

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true

params:
  env: production
  author: "Ali Raza"
  description: "Security research by Ali Raza: web vulnerabilities, malware investigations, and tools for understanding what I find."
  mainSections: ["research"]
  defaultTheme: dark
  DateFormat: "2006-01-02"
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocSide: "right"
  EnableInstantClick: true
  EnableImageZoom: true

  homeInfoParams:
    Title: "Investigations & field notes."
    Content: |
      I'm Ali, an application security engineer and security researcher. I investigate web vulnerabilities, reverse engineer malware, and build tools to understand what I find.

  socialIcons:
    - name: github
      url: "https://github.com/AAR072"
    - name: linkedin
      url: "https://www.linkedin.com/in/aliakber-raza/"
    - name: email
      url: "mailto:aliakberraza7@gmail.com"
    - name: cv
      url: "/Ali_Raza_resume.pdf"

minify:
  disableXML: true

menu:
  main:
    - name: Writing
      url: /research/
      weight: 1
    - name: Tools
      url: /tools/
      weight: 2
    - name: About
      url: /about/
      weight: 3

outputs:
  home:
    - HTML
    - JSON
  section:
    - HTML
  taxonomy:
    - HTML
  term:
    - HTML
  page:
    - HTML

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: dracula
    lineNos: false
    noClasses: false
